name: Automated Indian Market Day Trader Signals

on:
  schedule:
    # Runs Monday to Friday
    # 03:45 UTC = 09:15 AM IST (Morning Market Bell)
    - cron: '45 3 * * 1-5'
    # 04:00 UTC = 09:30 AM IST (15m Opening Range Breakout Check)
    - cron: '0 4 * * 1-5'
    # 04:30 UTC = 10:00 AM IST (Mid-Morning Momentum Check)
    - cron: '30 4 * * 1-5'
    # 07:30 UTC = 01:00 PM IST (European Open / Afternoon Session)
    - cron: '30 7 * * 1-5'
    # 09:40 UTC = 03:10 PM IST (Intraday Square-off Reminder)
    - cron: '40 9 * * 1-5'

  workflow_dispatch: # Allows manual trigger from GitHub anytime

jobs:
  trade-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install smartapi-python pyotp requests pandas logzero websocket-client

      - name: Run Market Signal Check & Send Telegram Alert
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python telegram_bot/cron_runner.py

name: Automated Indian Market Day Trader Signals

on:
  schedule:
    # Runs Monday to Friday
    # 03:45 UTC = 09:15 AM IST (Morning Market Bell)
    - cron: '45 3 * * 1-5'
    # Every 15 minutes from 04:05 UTC = 09:35 AM IST to 09:05 UTC = 02:35 PM IST
    # (opening-range break check; an alert is only sent while the break is fresh)
    - cron: '5,20,35,50 4-8 * * 1-5'
    - cron: '5 9 * * 1-5'
    # 09:40 UTC = 03:10 PM IST (Intraday Square-off Reminder)
    - cron: '40 9 * * 1-5'

  workflow_dispatch: # Allows manual trigger from GitHub anytime

jobs:
  trade-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Market Signal Check & Send Telegram Alert
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python telegram_bot/cron_runner.py
